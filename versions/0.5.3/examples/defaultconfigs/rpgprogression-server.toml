[compatibility]
	#Share RPG stamina with ParCool 4.x when installed. No ParCool dependency is required.
	parcoolSharedStamina = true
	#Range: 0.0 ~ 100.0
	parcoolCostMultiplier = 0.1
	#Share RPG stamina with Epic Fight 20.14.x when installed; optional.
	epicFightSharedStamina = true
	#RPG stamina per Epic Fight unit. 5 maps the initial 100 RPG stamina to 20 Epic Fight stamina.
	#Range: 0.001 ~ 1000.0
	epicFightStaminaUnit = 5.0
	#Range: 0.0 ~ 10000.0
	epicFightDefaultAttackCost = 12.0
	#RPG stamina per Epic Fight strike, before native armor/skill modifiers. Weapon category=cost; addon category names supported. Multi-target hits charge once per strike.
	epicFightWeaponAttackCosts = ["fist=4", "dagger=6", "sword=12", "longsword=18", "greatsword=24", "axe=16", "spear=14", "tachi=18", "uchigatana=10", "hoe=8", "pickaxe=14", "shovel=10", "bow=8", "crossbow=10", "shield=10", "not_weapon=6"]
	#Replace Iron's Spells n Spellbooks 3.16.x player mana with RPG mana when installed. Mobs remain native.
	ironsSharedMana = true

