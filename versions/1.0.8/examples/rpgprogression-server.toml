
[general]
	#Range: 0 ~ 100
	progressionRulesVersion = 10
	#Range: 0 ~ 1000
	startingAttributeValue = 10
	#Range: 0 ~ 100
	attributePointsPerLevel = 1
	#Range: 10 ~ 10000
	maxAttribute = 100
	creativeGainsXP = false

[experience]
	#Range: 1.0 ~ 1.0E12
	baseLevelXP = 500.0
	#Used only with levelXPCurve=EXPONENTIAL: round(baseLevelXP * levelXPMultiplier^(current level - 1)).
	#Range: 1.0 ~ 10.0
	levelXPMultiplier = 1.011111111111111
	#Range: 1.0 ~ 10000.0
	runningDistancePerXP = 20.0
	#Range: 0.1 ~ 10.0
	maximumRunningBlocksPerTick = 1.5
	#Shared running/fast-swimming XP limit per 1200 ticks. Riding, flight, stationary movement and slow swimming are excluded.
	#Range: 0 ~ 10000
	maximumRunningXPPerMinute = 30
	#STAGED: easy levels 1-5, moderate growth through 50, then harder quadratic growth. With base 500: costs at levels 1/5/50/100 are 500/700/7000/41000. EXPONENTIAL retains the old configurable formula.
	#Allowed Values: STAGED, EXPONENTIAL
	levelXPCurve = "STAGED"

[miningXP]
	#Range: 0.0 ~ 10000.0
	baseXP = 1.0
	#Range: 0.0 ~ 100.0
	hardnessMultiplier = 0.5
	#Range: 0.0 ~ 100.0
	oreMultiplier = 3.0
	#Range: 0.0 ~ 100.0
	rareOreMultiplier = 6.0
	#Range: 0.0 ~ 1.0
	playerPlacedMultiplier = 0.0
	#Range: 0.0 ~ 10000.0
	multiplier = 1.0
	#Absolute XP before multiplier. Examples: minecraft:zombie=20, minecraft:diamond_ore=15, minecraft:cooked_beef=4; #namespace:tag=amount is supported. Exact ID overrides tags.
	blockOverrides = []

[combatXP]
	#Range: 0.0 ~ 100.0
	xpPerMaxHealth = 0.5
	#Range: 0.0 ~ 100.0
	passiveMultiplier = 0.5
	#Range: 0.0 ~ 100.0
	hostileMultiplier = 2.0
	#Range: 0.0 ~ 1000.0
	bossMultiplier = 10.0
	#Range: 0.0 ~ 10000.0
	multiplier = 1.0
	#Absolute XP before multiplier. Examples: minecraft:zombie=20, minecraft:diamond_ore=15, minecraft:cooked_beef=4; #namespace:tag=amount is supported. Exact ID overrides tags.
	entityOverrides = []

[fishingXP]
	#Range: 0 ~ 10000
	fish = 8
	#Range: 0 ~ 10000
	junk = 3
	#Range: 0 ~ 10000
	treasure = 25
	#Range: 0.0 ~ 10000.0
	multiplier = 1.0
	#Absolute XP before multiplier. Examples: minecraft:zombie=20, minecraft:diamond_ore=15, minecraft:cooked_beef=4; #namespace:tag=amount is supported. Exact ID overrides tags.
	itemOverrides = []

[cookingXP]
	#Range: 0.0 ~ 1000000.0
	furnaceXPPerItem = 4.0
	#Range: 0.0 ~ 1000000.0
	campfireXPPerItem = 3.0
	#Range: 0.0 ~ 10000.0
	multiplier = 1.0
	#Absolute XP before multiplier. Examples: minecraft:zombie=20, minecraft:diamond_ore=15, minecraft:cooked_beef=4; #namespace:tag=amount is supported. Exact ID overrides tags.
	itemOverrides = []

[spark]
	#Range: 1 ~ 1000
	startingPotential = 10
	#Range: 1.0 ~ 1000000.0
	baseReservoir = 25.0
	#Range: 0.0 ~ 100000.0
	reservoirPerPotential = 1.0
	#Range: 0.0 ~ 1000000.0
	dimensionTravelCost = 25.0
	#Range: 1.0 ~ 86400.0
	baseFullRecoverySeconds = 1200.0
	#Full recovery time = base seconds / (1 + extra potential * this value). Tick based: 1200 seconds = 24000 ticks; sleeping does not instantly refill it.
	#Range: 0.0 ~ 10.0
	recoverySpeedPerPotential = 0.1

[mana]
	#New mana units per second. Capacity is 0..8, one unit per 5 Spark Potential levels above its starting value; equipment never increases it.
	#Range: 0.0 ~ 8.0
	unitRegenPerSecond = 0.2
	#Range: 0.0 ~ 60.0
	regenDelaySeconds = 2.0

[stamina]
	#Range: 1.0 ~ 100000.0
	baseStamina = 100.0
	#Range: 0.0 ~ 1000.0
	staminaPerEndurance = 10.0
	#Range: 0.0 ~ 10000.0
	sprintCostPerSecond = 4.0
	#Range: 0.0 ~ 10000.0
	attackCost = 12.0
	#Range: 0.0 ~ 10000.0
	bowShotCost = 8.0
