# Полный серверный конфиг. Перед установкой переименуйте файл в rpgprogression-server.toml.
# Путь и примеры: ../CONFIGURATION.ru.md. Пользовательский пример не применяется автоматически.

[itemRequirements]
	#Add or replace this attribute's requirement for any vanilla/mod item or placed workstation. item:id=level or #item_tag:id=level; 0 removes it. Matching configured rules replace the automatic requirement, and the highest matching configured value wins. Unmentioned attributes keep their defaults. Examples: minecraft:diamond_sword=30, minecraft:diamond_sword=0, #minecraft:swords=15. Missing optional items/tags are harmless.
	strength = []
	#Add or replace this attribute's requirement for any vanilla/mod item or placed workstation. item:id=level or #item_tag:id=level; 0 removes it. Matching configured rules replace the automatic requirement, and the highest matching configured value wins. Unmentioned attributes keep their defaults. Examples: minecraft:diamond_sword=30, minecraft:diamond_sword=0, #minecraft:swords=15. Missing optional items/tags are harmless.
	vitality = []
	#Add or replace this attribute's requirement for any vanilla/mod item or placed workstation. item:id=level or #item_tag:id=level; 0 removes it. Matching configured rules replace the automatic requirement, and the highest matching configured value wins. Unmentioned attributes keep their defaults. Examples: minecraft:diamond_sword=30, minecraft:diamond_sword=0, #minecraft:swords=15. Missing optional items/tags are harmless.
	spark_potential = []
	#Add or replace this attribute's requirement for any vanilla/mod item or placed workstation. item:id=level or #item_tag:id=level; 0 removes it. Matching configured rules replace the automatic requirement, and the highest matching configured value wins. Unmentioned attributes keep their defaults. Examples: minecraft:diamond_sword=30, minecraft:diamond_sword=0, #minecraft:swords=15. Missing optional items/tags are harmless.
	endurance = []
	#Add or replace this attribute's requirement for any vanilla/mod item or placed workstation. item:id=level or #item_tag:id=level; 0 removes it. Matching configured rules replace the automatic requirement, and the highest matching configured value wins. Unmentioned attributes keep their defaults. Examples: minecraft:diamond_sword=30, minecraft:diamond_sword=0, #minecraft:swords=15. Missing optional items/tags are harmless.
	agility = []
	#Keep automatic material, workstation and Iron's item requirements. False disables those defaults while keeping the custom lists below. Spell requirements have their own section.
	useDefaultRequirements = true
	#Add or replace this attribute's requirement for any vanilla/mod item or placed workstation. item:id=level or #item_tag:id=level; 0 removes it. Matching configured rules replace the automatic requirement, and the highest matching configured value wins. Unmentioned attributes keep their defaults. Examples: minecraft:diamond_sword=30, minecraft:diamond_sword=0, #minecraft:swords=15. Missing optional items/tags are harmless.
	intelligence = []

[spellRequirements]
	#Optional per-spell attribute override: irons_spellbooks:fireball=20. Applies to scrolls and spells inside books. 0 removes this attribute; empty keeps the automatic rule. Exact spell IDs only, no tags.
	strength = []
	#Optional per-spell attribute override: irons_spellbooks:fireball=20. Applies to scrolls and spells inside books. 0 removes this attribute; empty keeps the automatic rule. Exact spell IDs only, no tags.
	vitality = []
	#Optional per-spell attribute override: irons_spellbooks:fireball=20. Applies to scrolls and spells inside books. 0 removes this attribute; empty keeps the automatic rule. Exact spell IDs only, no tags.
	spark_potential = []
	#Intelligence per converted RPG mana unit for Iron's scrolls and book spells. Default 5; 0 disables the automatic spell requirement. Item/book requirements are checked separately.
	# Default: 5
	# Range: 0 ~ 10000
	intelligencePerManaUnit = 5
	#Optional per-spell attribute override: irons_spellbooks:fireball=20. Applies to scrolls and spells inside books. 0 removes this attribute; empty keeps the automatic rule. Exact spell IDs only, no tags.
	endurance = []
	#Optional per-spell attribute override: irons_spellbooks:fireball=20. Applies to scrolls and spells inside books. 0 removes this attribute; empty keeps the automatic rule. Exact spell IDs only, no tags.
	agility = []
	#Optional per-spell attribute override: irons_spellbooks:fireball=20. Applies to scrolls and spells inside books. 0 removes this attribute; empty keeps the automatic rule. Exact spell IDs only, no tags.
	intelligence = []
[spark]
	# Default: 2400.0
	# Range: 1.0 ~ 86400.0
	baseFullRecoverySeconds = 2400.0
	#Full recovery time = base seconds / (1 + extra potential * this value). Tick based: 2400 seconds = 48000 ticks; sleeping does not instantly refill it.
	# Default: 0.1
	# Range: 0.0 ~ 10.0
	recoverySpeedPerPotential = 0.1
	# Default: 25.0
	# Range: 0.0 ~ 1000000.0
	dimensionTravelCost = 25.0
	#Spark reservoir units per successful Skint route, within one dimension or between dimensions. 0 is free. This replaces the normal dimension price for Skint routes; the prices never add together.
	# Default: 5.0
	# Range: 0.0 ~ 1000000.0
	skintTravelCost = 5.0
	# Default: 25.0
	# Range: 1.0 ~ 1000000.0
	baseReservoir = 25.0
	# Default: 1.0
	# Range: 0.0 ~ 100000.0
	reservoirPerPotential = 1.0
	# Default: 10
	# Range: 1 ~ 1000
	startingPotential = 10

[experience]
	#Used when levelXPCurve=CUSTOM. Variables: level (current level), base (baseLevelXP), multiplier (levelXPMultiplier). Operators: + - * / % ^ and parentheses. Functions: min/max/pow (2 arguments), abs/sqrt/floor/ceil/round/log/exp (1), clamp(value,min,max). Example: base + (level - 1) * 150. Costs are rounded and limited to 1..9000000000000000; undefined results fall back to STAGED.
	customLevelXPFormula = "base * level ^ 2"
	# Default: 1.5
	# Range: 0.1 ~ 10.0
	maximumRunningBlocksPerTick = 1.5
	#STAGED: existing three-stage balance. EXPONENTIAL: base * multiplier^(level-1). CUSTOM: evaluate customLevelXPFormula. Defaults keep existing progression.
	#Allowed Values: STAGED, EXPONENTIAL, CUSTOM
	levelXPCurve = "STAGED"
	# Default: 20.0
	# Range: 1.0 ~ 10000.0
	runningDistancePerXP = 20.0
	# Default: 500.0
	# Range: 1.0 ~ 1.0E12
	baseLevelXP = 500.0
	#Used by EXPONENTIAL: round(baseLevelXP * levelXPMultiplier^(current level - 1)); also available as the multiplier variable in CUSTOM.
	# Default: 1.011111111111111
	# Range: 1.0 ~ 10.0
	levelXPMultiplier = 1.011111111111111
	#Shared running/fast-swimming XP limit per 1200 ticks. Riding, flight, stationary movement and slow swimming are excluded.
	# Default: 30
	# Range: 0 ~ 10000
	maximumRunningXPPerMinute = 30

[general]
	creativeGainsXP = false
	# Default: 10
	# Range: 0 ~ 1000
	startingAttributeValue = 10
	# Default: 0
	# Range: 0 ~ 100
	progressionRulesVersion = 11
	# Default: 100
	# Range: 10 ~ 10000
	maxAttribute = 100
	# Default: 1
	# Range: 0 ~ 100
	attributePointsPerLevel = 1

[stamina]
	# Default: 10
	# Range: 2 ~ 100
	syncIntervalTicks = 10
	# Default: 14.0
	# Range: 0.0 ~ 10000.0
	tridentThrowCost = 14.0
	# Default: 10.0
	# Range: 0.0 ~ 1000.0
	staminaPerEndurance = 10.0
	#Charged once on successful loading, not when firing. Cancelled/incomplete charging and missing ammo are free.
	# Default: 10.0
	# Range: 0.0 ~ 10000.0
	crossbowChargeCost = 10.0
	creativeConsumesStamina = false
	# Default: 0.4
	# Range: 0.01 ~ 1.0
	exhaustedMiningSpeed = 0.4
	# Default: 100.0
	# Range: 1.0 ~ 100000.0
	baseStamina = 100.0
	# Default: 0.15
	# Range: 0.01 ~ 1.0
	exhaustedRecoveryThreshold = 0.15
	# Default: 0.5
	# Range: 0.05 ~ 100.0
	syncDelta = 0.5
	# Default: 0.5
	# Range: 0.01 ~ 1.0
	exhaustedAttackSpeed = 0.5
	# Default: 1.0
	# Range: 0.0 ~ 1000.0
	miningHardnessCost = 1.0
	# Default: 1.0
	# Range: 0.0 ~ 1000.0
	miningBaseCost = 1.0
	# Default: 5.0
	# Range: 0.0 ~ 10000.0
	miningMaximumCost = 5.0
	# Default: 1.5
	# Range: 0.0 ~ 60.0
