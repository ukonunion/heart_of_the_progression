plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

group = 'dev.rpgprogression'
version = '0.8.1'
base { archivesName = 'heart-of-the-progression' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods { rpgprogression { source sourceSets.main } }
        }
        client {
            args '--width', '1280', '--height', '720'
            if (project.hasProperty('smoke')) property 'rpgprogression.smokeTest', 'true'
            if (project.hasProperty('hudSmoke')) property 'rpgprogression.hudSmokeTest', 'true'
            if (project.hasProperty('relogin')) property 'rpgprogression.reloginOnly', 'true'
            if (project.hasProperty('lifecycleSmoke')) property 'rpgprogression.lifecycleSmoke', 'true'
            if (project.hasProperty('lifecycleRelogin')) property 'rpgprogression.lifecycleRelogin', 'true'
            if (project.hasProperty('smokeWorld')) property 'rpgprogression.smokeWorld', project.property('smokeWorld')
            if (project.hasProperty('manaSmoke')) property 'rpgprogression.manaSmoke', 'true'
            if (project.hasProperty('manaRelogin')) property 'rpgprogression.manaRelogin', 'true'
            if (project.hasProperty('treeSmoke')) property 'rpgprogression.treeSmoke', 'true'
            if (project.hasProperty('treeRelogin')) property 'rpgprogression.treeRelogin', 'true'
        }
        server { args '--nogui' }
        gameTestServer {
            def profile = ['irons','epicfight','parcool'].findAll { project.hasProperty(it) }
            workingDirectory project.file("run/gametests/${profile ? profile.join('-') : 'standalone'}")
            property 'forge.enabledGameTestNamespaces', 'rpgprogression'
        }
    }
}
mixin {
    add sourceSets.main, 'rpgprogression.refmap.json'
    config 'rpgprogression.mixins.json'
}
repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven { url = 'https://maven.kosmx.dev/' }
    maven { url = 'https://code.redspace.io/releases' }
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.23'
    compileOnly fg.deobf('maven.modrinth:parcool:5dvUJxhR')
    if (project.hasProperty('parcool')) runtimeOnly fg.deobf('maven.modrinth:parcool:5dvUJxhR')
    compileOnly fg.deobf('maven.modrinth:epic-fight:KEBfkBat')
    if (project.hasProperty('epicfight')) runtimeOnly fg.deobf('maven.modrinth:epic-fight:KEBfkBat')
    compileOnly fg.deobf('maven.modrinth:irons-spells-n-spellbooks:hZaEegS9')
    compileOnly fg.deobf('maven.modrinth:geckolib:aC5KMoNg')
    compileOnly fg.deobf('maven.modrinth:curios:IPQlZkz1')
    compileOnly fg.deobf('dev.kosmx.player-anim:player-animation-lib-forge:1.0.2-rc1+1.20')
    compileOnly fg.deobf("io.redspace:irons_lib:${project.findProperty('ironsLibVersion') ?: '1.20.1-2.1.0'}")
    if (project.hasProperty('irons')) {
        runtimeOnly fg.deobf('maven.modrinth:irons-spells-n-spellbooks:hZaEegS9')
        runtimeOnly fg.deobf('maven.modrinth:geckolib:aC5KMoNg')
        runtimeOnly fg.deobf('maven.modrinth:curios:IPQlZkz1')
        runtimeOnly fg.deobf('dev.kosmx.player-anim:player-animation-lib-forge:1.0.2-rc1+1.20')
        runtimeOnly fg.deobf("io.redspace:irons_lib:${project.findProperty('ironsLibVersion') ?: '1.20.1-2.1.0'}")
    }
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Mixin's refmap aggregates all mixins. An incremental compile of an unrelated
    // class can delete that generated file without running the annotation processor.
    options.incremental = false
}
tasks.named('test', Test) { useJUnitPlatform() }
tasks.named('jar', Jar) {
    exclude 'dev/rpgprogression/gametest/**'
    doFirst {
        if (!layout.buildDirectory.file('tmp/compileJava/compileJava-refmap.json').get().asFile.isFile()) {
            throw new GradleException('Mixin refmap is missing; the release JAR would fail to start.')
        }
    }
    manifest { attributes('MixinConfigs': 'rpgprogression.mixins.json', 'Implementation-Version': project.version) }
    finalizedBy 'reobfJar'
}
